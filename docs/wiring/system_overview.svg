" stroke-linejoin="round" stroke-linecap="round"/><polyline points="360,360 260,360" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="310.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="middle" font-weight="700">ESP-NOW</text><polyline points="540,330 640,330" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="640,360 540,360" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="590.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="middle" font-weight="700">ESP-NOW</text><polyline points="820,330 920,330" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="920,360 820,360" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="870.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="middle" font-weight="700">ESP-NOW</text><polyline points="1120,330 1220,330" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1220,360 1120,360" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="1170" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#188038" text-anchor="middle" font-weight="700">Wi-Fi HTTP</text><text x="1170" y="380" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="middle" font-weight="400">1 s</text><polyline points="1335,200 1335,300" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1345" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#188038" text-anchor="start" font-weight="700">Wi-Fi</text><polyline points="1335,480 1335,390" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1345" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#188038" text-anchor="start" font-weight="700">Wi-Fi</text><rect x="360" y="470" width="180" height="50" rx="8" fill="#fff" stroke="#1d2327" stroke-width="2"/><text x="450.0" y="500.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">MQ · AHT · buzzer</text><polyline points="450,390 450,470" fill="none" stroke="#5f6368" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="640" y="470" width="180" height="50" rx="8" fill="#fff" stroke="#1d2327" stroke-width="2"/><text x="730.0" y="500.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">MQ · AHT · buzzer</text><polyline points="730,390 730,470" fill="none" stroke="#5f6368" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="470" width="180" height="50" rx="8" fill="#fff" stroke="#1d2327" stroke-width="2"/><text x="1020.0" y="500.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">MQ · AHT · buzzer</text><polyline points="1020,390 1020,470" fill="none" stroke="#5f6368" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="60" y="120" width="760" height="102" rx="8" fill="#fff8e1" stroke="#F2A900" stroke-width="2"/><text x="74" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="700">Packet: 54 bytes / worker / second (MS_VER 3)</text><text x="74" y="163" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">Up: telemetry hops to the main repeater, then HTTP POST to /api/telemetry.</text><text x="74" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">Down: alert in the HTTP reply → repeater beacons → every buzzer + body LED.</text><text x="74" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">Routes self-heal: parent = neighbour with fewest hops, RSSI ≥ −92 dBm.</text><text x="60" y="604" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="start" font-weight="700">WIRES:</text><polyline points="120,600 146,600" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="154" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">ESP-NOW data (2.4 GHz)</text><polyline points="330.4,600 356.4,600" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="364.4" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Wi-Fi / HTTP</text><polyline points="468.79999999999995,600 494.79999999999995,600" fill="none" stroke="#00838f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="502.79999999999995" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Alert path (dashed)</text></svg>