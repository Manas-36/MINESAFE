<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060"><defs><pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#F2A900"/><rect x="14" width="14" height="28" fill="#12171A"/></pattern></defs><rect width="1700" height="1060" fill="#ffffff"/><rect x="0" y="0" width="1700" height="10" fill="url(#hz)"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1d2327" text-anchor="start" font-weight="700">MineSafe V4 — smart suit architecture</text><text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f6b72" text-anchor="start" font-weight="400">One suit replaces the tagged kit · pods are removable so the suit can be washed · opening / tearing is reported, never locked</text><rect x="40" y="110" width="860" height="800" rx="8" fill="#fbfaf6" stroke="#1d2327" stroke-width="2" stroke-dasharray="8 6"/><text x="470.0" y="515.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1d2327" text-anchor="start" font-weight="700">THE SUIT (one worker)</text><rect x="70" y="170" width="380" height="150" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="260.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="260.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Helmet pod</text><text x="260.0" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">XIAO ESP32-C6 · 2.4 GHz antenna (head height)</text><text x="260.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">speaker + amp: voice alerts</text><text x="260.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">helmet-worn switch · own 600 mAh battery</text><rect x="480" y="170" width="390" height="150" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="675.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="675.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Wrist cuff</text><text x="675.0" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">1.3" OLED · 3 large buttons</text><text x="675.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">vibration motor</text><text x="675.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">MAX30102 heart rate + SpO₂</text><rect x="70" y="400" width="800" height="180" rx="8" fill="#12171A" stroke="#12171A" stroke-width="2"/><text x="470.0" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="470.0" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#F3F0E8" text-anchor="middle" font-weight="700">Core pod (chest)</text><text x="470.0" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">ESP32-C6 · 3000 mAh battery · fuel gauge · charge contacts</text><text x="470.0" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">IMU (fall, no movement) · pressure (level) · big SOS button</text><text x="470.0" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">joins everything, decides SAFE / WARNING / DANGER, talks to the repeaters</text><rect x="70" y="660" width="380" height="170" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="260.0" y="750.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="260.0" y="690" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Suit fabric</text><text x="260.0" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">FR coverall · conductive-thread loop in seams</text><text x="260.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">zip-closed reed switch · skin-contact pad</text><text x="260.0" y="748" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">skin temperature (chest)</text><rect x="480" y="660" width="390" height="170" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="675.0" y="750.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="675.0" y="690" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Boot pod</text><text x="675.0" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">XIAO ESP32-C6 · BMI270 foot IMU</text><text x="675.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">exact step length (foot-mounted)</text><text x="675.0" y="748" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">boot-worn force sensor</text><polyline points="260,320 260,400" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="700">ESP-NOW (suit key)</text><polyline points="675,320 675,400" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="685" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#188038" text-anchor="start" font-weight="700">sleeve cable (I²C + GPIO)</text><polyline points="260,580 260,660" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#188038" text-anchor="start" font-weight="700">sewn wires / snaps</text><polyline points="675,580 675,660" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="685" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="700">ESP-NOW (suit key)</text><rect x="1000" y="170" width="300" height="120" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="1150.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="1150.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Repeaters (tunnel)</text><text x="1150.0" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">ESP-NOW chain · LED exit signs</text><text x="1150.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">gas + air · SOS · (LoRa backbone opt.)</text><rect x="1000" y="400" width="300" height="140" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="1150.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="1150.0" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Entry chamber</text><text x="1150.0" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">main repeater (pairs the suit)</text><text x="1150.0" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">ID-card tap (PN532) · phone photo</text><text x="1150.0" y="488" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="middle" font-weight="400">charging dock for suits</text><rect x="1380" y="400" width="280" height="140" rx="8" fill="#12171A" stroke="#12171A" stroke-width="2"/><text x="1520.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="1520.0" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#F3F0E8" text-anchor="middle" font-weight="700">Hub + control app</text><text x="1520.0" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">laptop / mini-PC</text><text x="1520.0" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">admin_hub.py · /control 3D app</text><text x="1520.0" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="600">login · alerts · history</text><polyline points="870,470 1000,470" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="935" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="middle" font-weight="700">ESP-NOW</text><polyline points="1150,290 1150,400" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1160" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="700">ESP-NOW chain</text><polyline points="1300,470 1380,470" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1305" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#188038" text-anchor="start" font-weight="700">Wi-Fi</text><polyline points="1380,500 1300,500" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="1305" y="520" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="start" font-weight="400">alerts / route</text><rect x="960" y="600" width="700" height="159" rx="8" fill="#fff8e1" stroke="#F2A900" stroke-width="2"/><text x="974" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="700">Shift flow</text><text x="974" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">1  Take a charged suit from the dock, put it on.</text><text x="974" y="662" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">2  Suit self-check: helmet, boots, cuff connected, zip closed, skin contact.</text><text x="974" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">3  Tap ID card in the entry chamber (+ photo) → hub pairs suit ↔ worker.</text><text x="974" y="700" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">4  Monitoring starts; kit is checked all shift, not only at the gate.</text><text x="974" y="719" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">5  Helmet off / suit opened / torn → admin alert (never a lock).</text><text x="974" y="738" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">6  Exit: unpair at the chamber, suit back on the dock.</text><text x="40" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="start" font-weight="700">WIRES:</text><polyline points="100,1020 126,1020" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="134" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">ESP-NOW radio</text><polyline points="245.60000000000002,1020 271.6,1020" fill="none" stroke="#188038" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="279.6" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Wire / Wi-Fi</text><polyline points="384.0,1020 410.0,1020" fill="none" stroke="#00838f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="418.0" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Commands down (dashed)</text></svg>