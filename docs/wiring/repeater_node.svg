<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#F2A900"/><rect x="14" width="14" height="28" fill="#12171A"/></pattern></defs><rect width="1400" height="800" fill="#ffffff"/><rect x="0" y="0" width="1400" height="10" fill="url(#hz)"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1d2327" text-anchor="start" font-weight="700">Repeater node — wiring schematic</text><text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f6b72" text-anchor="start" font-weight="400">Main repeater (IS_GATEWAY 1, joins Wi-Fi) and tunnel repeaters (IS_GATEWAY 0) use the same circuit</text><rect x="170" y="140" width="260" height="470" rx="8" fill="#12171A" stroke="#12171A" stroke-width="2"/><text x="300.0" y="380.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700"></text><text x="300.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#F3F0E8" text-anchor="middle" font-weight="700">ESP32-S3 DevKit</text><text x="300.0" y="194" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#F2A900" text-anchor="middle" font-weight="600">or Seeed XIAO ESP32-C6</text><rect x="165" y="245" width="10" height="10" fill="#F2A900"/><text x="182" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3F0E8" text-anchor="start" font-weight="600">5V (USB)</text><rect x="165" y="315" width="10" height="10" fill="#F2A900"/><text x="182" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3F0E8" text-anchor="start" font-weight="600">3V3</text><rect x="165" y="555" width="10" height="10" fill="#F2A900"/><text x="182" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3F0E8" text-anchor="start" font-weight="600">GND</text><rect x="425" y="275" width="10" height="10" fill="#F2A900"/><text x="418" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3F0E8" text-anchor="end" font-weight="600">GPIO5 / D10</text><rect x="425" y="435" width="10" height="10" fill="#F2A900"/><text x="418" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3F0E8" text-anchor="end" font-weight="600">GPIO4 / D2  ADC</text><polyline points="165,250 135,250 135,220" fill="none" stroke="#e8710a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="135" y1="220" x2="135" y2="206" stroke="#e8710a" stroke-width="2.4"/><line x1="124" y1="206" x2="146" y2="206" stroke="#e8710a" stroke-width="3"/><text x="135" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8710a" text-anchor="middle" font-weight="700">5V</text><text x="131" y="272" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="end" font-weight="400">USB 5 V adapter</text><polyline points="165,320 143,320" fill="none" stroke="#d93025" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="139" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="end" font-weight="400">nc</text><polyline points="165,560 135,560 135,580" fill="none" stroke="#202124" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="135" y1="580" x2="135" y2="590" stroke="#202124" stroke-width="2.4"/><line x1="123" y1="590" x2="147" y2="590" stroke="#202124" stroke-width="2.4"/><line x1="128" y1="595" x2="142" y2="595" stroke="#202124" stroke-width="2.4"/><line x1="132" y1="600" x2="138" y2="600" stroke="#202124" stroke-width="2.4"/><rect x="620" y="235" width="210" height="90" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="725.0" y="271" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">Buzzer</text><text x="725.0" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="middle" font-weight="400">active, 3–5 V</text><rect x="616" y="261" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="630" y="269" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">+</text><rect x="616" y="296" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="630" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">−</text><polyline points="435,280 520,280 520,265 620,265" fill="none" stroke="#9334e6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="620,300 580,300 580,350" fill="none" stroke="#202124" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="580" y1="350" x2="580" y2="360" stroke="#202124" stroke-width="2.4"/><line x1="568" y1="360" x2="592" y2="360" stroke="#202124" stroke-width="2.4"/><line x1="573" y1="365" x2="587" y2="365" stroke="#202124" stroke-width="2.4"/><line x1="577" y1="370" x2="583" y2="370" stroke="#202124" stroke-width="2.4"/><text x="880" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="start" font-weight="400">Passive buzzer → BUZZER_PASSIVE 1</text><text x="880" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="start" font-weight="400">3-pin low-trigger module → BUZZER_ACTIVE_LOW 1,</text><text x="880" y="298" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="start" font-weight="400">module VCC to 5V</text><rect x="1000" y="420" width="280" height="170" rx="8" fill="#f6f4ef" stroke="#1d2327" stroke-width="2"/><text x="1140.0" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1d2327" text-anchor="middle" font-weight="700">MQ gas sensor</text><text x="1140.0" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="middle" font-weight="400">MQ-2 / MQ-7 / MQ-135 module</text><rect x="996" y="456" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="1010" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">VCC</text><rect x="996" y="486" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="1010" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">AO</text><rect x="996" y="516" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="1010" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">DO</text><rect x="996" y="546" width="8" height="8" fill="#fff" stroke="#1d2327" stroke-width="1.5"/><text x="1010" y="554" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1d2327" text-anchor="start" font-weight="600">GND</text><text x="988" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="end" font-weight="400">nc</text><polyline points="1000,460 940,460 940,420" fill="none" stroke="#e8710a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="940" y1="420" x2="940" y2="406" stroke="#e8710a" stroke-width="2.4"/><line x1="929" y1="406" x2="951" y2="406" stroke="#e8710a" stroke-width="3"/><text x="940" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8710a" text-anchor="middle" font-weight="700">5V</text><polyline points="1000,550 950,550 950,600" fill="none" stroke="#202124" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="950" y1="600" x2="950" y2="610" stroke="#202124" stroke-width="2.4"/><line x1="938" y1="610" x2="962" y2="610" stroke="#202124" stroke-width="2.4"/><line x1="943" y1="615" x2="957" y2="615" stroke="#202124" stroke-width="2.4"/><line x1="947" y1="620" x2="953" y2="620" stroke="#202124" stroke-width="2.4"/><text x="805.0" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="middle" font-weight="700">10 kΩ</text><polyline points="720,490 787.0,490 790.0,497 795.0,483 800.0,497 805.0,483 810.0,497 815.0,483 823.0,490 890,490" fill="none" stroke="#00838f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="890,490 1000,490" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="640,490 720,490" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="490" r="4.5" fill="#00838f"/><polyline points="435,440 640,440 640,490" fill="none" stroke="#00838f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="654" y="549.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="700">20 kΩ</text><polyline points="640,490 640,527.0 647,530.0 633,535.0 647,540.0 633,545.0 647,550.0 633,555.0 640,563.0 640,600" fill="none" stroke="#00838f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="640" y1="600" x2="640" y2="610" stroke="#202124" stroke-width="2.4"/><line x1="628" y1="610" x2="652" y2="610" stroke="#202124" stroke-width="2.4"/><line x1="633" y1="615" x2="647" y2="615" stroke="#202124" stroke-width="2.4"/><line x1="637" y1="620" x2="643" y2="620" stroke="#202124" stroke-width="2.4"/><text x="626" y="480" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="end" font-weight="700">0–3.3 V</text><text x="930" y="480" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5f6b72" text-anchor="middle" font-weight="700">0–5 V</text><text x="1140" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="middle" font-weight="400" font-style="italic">pin order differs between modules — match the labels</text><line x1="210" y1="140" x2="210" y2="110" stroke="#5f6368" stroke-width="2.4"/><polyline points="196,88 210,110 224,88" fill="none" stroke="#5f6368" stroke-width="2.4"/><line x1="210" y1="110" x2="210" y2="86" stroke="#5f6368" stroke-width="2.4"/><text x="230" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6b72" text-anchor="start" font-weight="600">u.FL (XIAO C6)</text><rect x="170" y="650" width="860" height="64" rx="8" fill="#fff8e1" stroke="#F2A900" stroke-width="2"/><text x="184" y="674" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="700">Divider: V_pin = V_AO × 20k / (10k + 20k) = 0.667 × V_AO</text><text x="184" y="693" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d2327" text-anchor="start" font-weight="400">Firmware multiplies by 1.5 to recover the sensor voltage; MQ heater needs 5 V, ~150 mA, 60 s warm-up.</text><text x="170" y="764" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6b72" text-anchor="start" font-weight="700">WIRES:</text><polyline points="230,760 256,760" fill="none" stroke="#e8710a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="264" y="764" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">5 V</text><polyline points="303.6,760 329.6,760" fill="none" stroke="#202124" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="337.6" y="764" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Ground</text><polyline points="398.8,760 424.8,760" fill="none" stroke="#00838f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="432.8" y="764" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Analog (MQ AO)</text><polyline points="551.6,760 577.6,760" fill="none" stroke="#9334e6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="585.6" y="764" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d2327" text-anchor="start" font-weight="400">Digital out</text></svg>